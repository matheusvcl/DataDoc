name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate HTML structure
        run: |
          grep -q '<div id="root">' index.html
          grep -q 'type="text/babel"' index.html
          echo "HTML structure OK"

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            node --check "$f" 2>/dev/null || echo "WARN: $f has Babel/JSX (expected)"
          done
          echo "JS files present: $(ls js/*.js | wc -l)"

      - name: Validate CSS variables
        run: |
          grep -q ':root' css/variables.css
          echo "CSS variables file OK"

  check-tauri:
    name: Tauri Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-check-${{ runner.os }}-${{ hashFiles('tauri/Cargo.lock', 'tauri/Cargo.toml') }}
          restore-keys: |
            rust-check-${{ runner.os }}-

      - name: Check Rust compilation
        working-directory: tauri
        run: cargo check --release

      - name: Verify tauri config
        run: |
          node -e "
            const conf = require('./tauri/tauri.conf.json');
            if (conf.identifier !== 'com.datadoc.app') throw new Error('Bad identifier');
            if (!conf.plugins.updater) throw new Error('Updater plugin missing');
            if (!conf.plugins.updater.pubkey) throw new Error('Updater pubkey missing');
            console.log('Tauri config OK:', conf.productName, conf.version);
          "

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/
          cp favicon.png dist/
          if [ -d assets ]; then cp -r assets dist/; fi

      - name: Verify dist
        run: |
          test -f dist/index.html
          test -f dist/js/app.js
          test -f dist/js/update.js
          test -f dist/css/variables.css
          echo "dist/ structure OK"
          find dist -type f | wc -l
          echo "files in dist"

  build:
    name: Build Windows
    needs: [lint-frontend, check-tauri, build-frontend]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('tauri/Cargo.lock', 'tauri/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Prepare frontend
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/
          cp favicon.png dist/
          if [ -d assets ]; then cp -r assets dist/; fi

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          
          # Extract changelog for this version
          if [ -f changelog/CHANGELOG.md ]; then
            NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" changelog/CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -z "$NOTES" ]; then
              NOTES="Sem notas de release disponíveis."
            fi
          else
            NOTES="Sem notas de release disponíveis."
          fi
          
          # Use delimiter for multiline output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DataDoc ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: datadoc-windows
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: datadoc-windows
          path: ./artifacts

      - name: List release files
        run: |
          echo "=== Release artifacts ==="
          ls -lh artifacts/
          echo ""
          echo "=== NSIS installer ==="
          ls -lh artifacts/nsis/ 2>/dev/null || echo "No nsis dir"
          echo ""
          echo "=== MSI ==="
          ls -lh artifacts/msi/ 2>/dev/null || echo "No msi dir"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
