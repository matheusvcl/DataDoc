name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate HTML structure
        run: |
          grep -q '<div id="root">' index.html
          grep -q 'type="text/babel"' index.html
          echo "HTML structure OK"

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            node --check "$f" 2>/dev/null || echo "WARN: $f has Babel/JSX (expected)"
          done
          echo "JS files present: $(ls js/*.js | wc -l)"

      - name: Validate CSS variables
        run: |
          grep -q ':root' css/variables.css
          echo "CSS variables file OK"

  check-tauri:
    name: Tauri Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: List old caches
        id: old-caches
        shell: bash
        run: |
          OLD_KEY="rust-check-${{ runner.os }}-"
          caches=$(gh cache list --key "$OLD_KEY" --json id --jq '.[].id' 2>/dev/null || true)
          echo "$caches" > /tmp/old_cache_ids.txt
          echo "Found $(echo "$caches" | grep -c . || echo 0) old caches"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-check-${{ runner.os }}-${{ hashFiles('tauri/Cargo.lock', 'tauri/Cargo.toml') }}
          restore-keys: |
            rust-check-${{ runner.os }}-

      - name: Check Rust compilation
        working-directory: tauri
        run: cargo check --release

      - name: Clean old caches
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/old_cache_ids.txt ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              gh cache delete "$id" 2>/dev/null || true
            done < /tmp/old_cache_ids.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tauri config
        run: |
          node -e "
            const conf = require('./tauri/tauri.conf.json');
            if (conf.identifier !== 'com.datadoc.desktop') throw new Error('Bad identifier');
            if (!conf.plugins.updater) throw new Error('Updater plugin missing');
            if (!conf.plugins.updater.pubkey) throw new Error('Updater pubkey missing');
            console.log('Tauri config OK:', conf.productName, conf.version);
          "

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/
          cp favicon.png dist/
          if [ -d assets ]; then cp -r assets dist/; fi

      - name: Verify dist
        run: |
          test -f dist/index.html
          test -f dist/js/app.js
          test -f dist/js/update.js
          test -f dist/css/variables.css
          echo "dist/ structure OK"
          find dist -type f | wc -l
          echo "files in dist"

  build:
    name: Build Windows
    needs: [lint-frontend, check-tauri, build-frontend]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: List old caches
        id: old-caches
        shell: bash
        run: |
          OLD_KEY="rust-${{ runner.os }}-"
          caches=$(gh cache list --key "$OLD_KEY" --json id --jq '.[].id' 2>/dev/null || true)
          echo "$caches" > /tmp/old_cache_ids.txt
          echo "Found $(echo "$caches" | grep -c . || echo 0) old caches"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('tauri/Cargo.lock', 'tauri/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Prepare frontend
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/
          cp favicon.png dist/
          if [ -d assets ]; then cp -r assets dist/; fi

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Pick changelog file: beta/alpha/rc tags use CHANGELOG_BETA.md
          if echo "$VERSION" | grep -qE '(beta|alpha|rc)' && [ -f changelogs/CHANGELOG_BETA.md ]; then
            FILE="changelogs/CHANGELOG_BETA.md"
          elif [ -f changelogs/CHANGELOG.md ]; then
            FILE="changelogs/CHANGELOG.md"
          else
            FILE=""
          fi
          
          # Extract changelog — try with v prefix first, then without
          if [ -n "$FILE" ]; then
            NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" "$FILE" | sed '1d;/^## \[/d' | sed '/^$/N;/^\n$/d')
            if [ -z "$NOTES" ]; then
              # Strip v and retry
              VERSION_NO_V="${VERSION#v}"
              NOTES=$(sed -n "/^## \[$VERSION_NO_V\]/,/^## \[/p" "$FILE" | sed '1d;/^## \[/d' | sed '/^$/N;/^\n$/d')
              VERSION="$VERSION_NO_V"
            fi
            if [ -z "$NOTES" ]; then
              NOTES="Sem notas de release disponíveis."
            fi
          else
            NOTES="Sem notas de release disponíveis."
          fi
          
          # Use delimiter for multiline output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DataDoc ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate and upload latest.json
        shell: bash
        run: |
          # Find the NSIS installer
          INSTALLER=$(ls tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No NSIS installer found"
            exit 1
          fi
          echo "Installer: $INSTALLER"
          
          # Sign the installer to get the updater signature
          npx @tauri-apps/cli@latest signer sign \
            -p "" \
            "$INSTALLER"
          
          SIG_FILE="${INSTALLER}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::Signature file not generated"
            exit 1
          fi
          SIGNATURE=$(cat "$SIG_FILE")
          echo "Signature generated: ${SIGNATURE:0:40}..."
          
          # Extract version from tauri.conf.json
          VERSION=$(node -e "console.log(require('./tauri/tauri.conf.json').version)")
          TAG="${{ github.ref_name }}"
          echo "Version: $VERSION, Tag: $TAG"
          
          # Create latest.json
          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "$(echo '${{ steps.changelog.outputs.notes }}' | head -5 | tr '\n' ' ')",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$INSTALLER")"
              }
            }
          }
          JSONEOF
          
          # Fix indentation (heredoc adds spaces)
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            fs.writeFileSync('latest.json', JSON.stringify(data, null, 2) + '\n');
          "
          
          echo "=== latest.json ==="
          cat latest.json
          
          # Upload to release
          gh release upload "$TAG" latest.json \
            --repo "${{ github.repository }}" \
            --clobber
          echo "latest.json uploaded to release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Push latest.json to dev branch
        shell: bash
        run: |
          if [ ! -f latest.json ]; then
            echo "::warning::latest.json not found, skipping push"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout dev
          cp latest.json ./latest.json
          git add latest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: atualizar latest.json para ${{ github.ref_name }}"
          git push origin dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datadoc-windows
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Clean old caches
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/old_cache_ids.txt ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              gh cache delete "$id" 2>/dev/null || true
            done < /tmp/old_cache_ids.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
