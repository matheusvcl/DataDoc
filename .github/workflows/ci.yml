name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate HTML structure
        run: |
          grep -q '<div id="root">' index.html
          grep -q 'type="text/babel"' index.html
          echo "HTML structure OK"

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            node --check "$f" 2>/dev/null || echo "WARN: $f has Babel/JSX (expected)"
          done
          echo "JS files present: $(ls js/*.js | wc -l)"

      - name: Run core tests
        run: node --test tests/core.test.js

      - name: Build dist
        run: node scripts/build.js

      - name: Validate CSS variables
        run: |
          grep -q ':root' css/variables.css
          echo "CSS variables file OK"

  check-tauri:
    name: Tauri Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Ciclo de cache: restaura o anterior -> usa -> salva o novo -> deleta os antigos
      - name: Restaurar cache (anterior)
        uses: actions/cache/restore@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rust-check-${{ runner.os }}-

      - name: Check Rust compilation
        working-directory: tauri
        run: cargo check --release

      - name: Salvar cache (novo)
        if: success()
        uses: actions/cache/save@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-check-${{ runner.os }}-${{ github.run_id }}

      - name: Deletar caches antigos
        if: success()
        uses: actions/github-script@v7
        env:
          CACHE_PREFIX: rust-check-${{ runner.os }}-
          CACHE_CURRENT: rust-check-${{ runner.os }}-${{ github.run_id }}
        with:
          script: |
            const prefix = process.env.CACHE_PREFIX;
            const current = process.env.CACHE_CURRENT;
            const { data } = await github.rest.actions.listActionsCachesForRepo({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const antigos = data.actions_caches.filter(c => c.key.startsWith(prefix) && c.key !== current);
            for (const c of antigos) {
              await github.rest.actions.deleteActionsCacheByKey({ owner: context.repo.owner, repo: context.repo.repo, key: c.key });
              core.info(`Cache antigo deletado: ${c.key}`);
            }
            core.info(`${antigos.length} cache(s) antigo(s) removido(s); mantido: ${current}`);

      - name: Verify tauri config
        run: |
          node -e "
            const conf = require('./tauri/tauri.conf.json');
            if (conf.identifier !== 'com.datadoc.desktop') throw new Error('Bad identifier');
            if (!conf.plugins.updater) throw new Error('Updater plugin missing');
            if (!conf.plugins.updater.pubkey) throw new Error('Updater pubkey missing');
            console.log('Tauri config OK:', conf.productName, conf.version);
          "

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare dist
        run: node scripts/build.js

      - name: Verify dist
        run: |
          test -f dist/index.html
          test -f dist/js/app.js
          test -f dist/js/update.js
          test -f dist/css/variables.css
          echo "dist/ structure OK"
          find dist -type f | wc -l
          echo "files in dist"
