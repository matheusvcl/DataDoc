name: Test Update System

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Version to test (e.g. 0.0.9-test)'
        required: true
        default: '0.0.9-test'

permissions:
  contents: write
  actions: write

jobs:
  build-test:
    name: Build Test Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Ciclo de cache: restaura o anterior -> usa -> salva o novo -> deleta os antigos
      - name: Restaurar cache (anterior)
        uses: actions/cache/restore@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rust-test-${{ runner.os }}-

      - name: Set test version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('tauri/tauri.conf.json', 'utf8'));
            conf.version = '${{ inputs.test_version }}';
            fs.writeFileSync('tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            console.log('Version set to:', conf.version);
          "

      - name: Prepare frontend
        shell: bash
        run: node scripts/build.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ inputs.test_version }}
          releaseName: 'DataDoc v${{ inputs.test_version }} (Teste)'
          releaseBody: |
            ## Teste de Atualização

            Esta é uma release de teste para validar o sistema de atualização.

            **Não instale em produção.**
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true

      - name: Salvar cache (novo)
        if: success()
        uses: actions/cache/save@v5
        with:
          path: |
            tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-test-${{ runner.os }}-${{ github.run_id }}

      - name: Deletar caches antigos
        if: success()
        uses: actions/github-script@v7
        env:
          CACHE_PREFIX: rust-test-${{ runner.os }}-
          CACHE_CURRENT: rust-test-${{ runner.os }}-${{ github.run_id }}
        with:
          script: |
            const prefix = process.env.CACHE_PREFIX;
            const current = process.env.CACHE_CURRENT;
            const caches = await github.paginate('GET /repos/{owner}/{repo}/actions/caches', {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            // inclui os caches legados do swatinem/rust-cache (v0-rust-*)
            const antigos = caches.filter(c =>
              (c.key.startsWith(prefix) || c.key.startsWith('v0-rust-')) && c.key !== current
            );
            for (const c of antigos) {
              await github.request('DELETE /repos/{owner}/{repo}/actions/caches{?key}', { owner: context.repo.owner, repo: context.repo.repo, key: c.key });
              core.info(`Cache antigo deletado: ${c.key}`);
            }
            core.info(`${antigos.length} cache(s) antigo(s) removido(s); mantido: ${current}`);

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate and upload latest.json
        shell: bash
        run: |
          INSTALLER=$(ls tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No NSIS installer found"
            exit 1
          fi
          echo "Installer: $INSTALLER"
          
          # (o CLI atual exige --private-key-path; o env sozinho nao basta)
          KEY_FILE="$RUNNER_TEMP/tauri.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_FILE.raw"
          if base64 -d "$KEY_FILE.raw" > "$KEY_FILE" 2>/dev/null && grep -q "untrusted comment" "$KEY_FILE"; then
            echo "Chave decodificada (base64)"
          else
            cp "$KEY_FILE.raw" "$KEY_FILE"
          fi
          npx @tauri-apps/cli@latest signer sign \
            --private-key-path "$KEY_FILE" \
            -p "" \
            "$INSTALLER"
          
          SIG_FILE="${INSTALLER}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::Signature file not generated"
            exit 1
          fi
          SIGNATURE=$(cat "$SIG_FILE")
          echo "Signature generated: ${SIGNATURE:0:40}..."
          
          VERSION="${{ inputs.test_version }}"
          TAG="v${{ inputs.test_version }}"
          
          # Generate latest.json with Node.js (safe JSON construction)
          node -e "
            const fs = require('fs');
            const installer = '$(basename "$INSTALLER")';
            const version = '$VERSION';
            const tag = '$TAG';
            const signature = '$SIGNATURE';
            const repo = '${{ github.repository }}';
            
            const data = {
              version: version,
              notes: 'Release de teste para validar o sistema de atualização.',
              pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
              platforms: {
                'windows-x86_64': {
                  signature: signature,
                  url: 'https://github.com/' + repo + '/releases/download/' + tag + '/' + installer
                }
              }
            };
            
            fs.writeFileSync('latest.json', JSON.stringify(data, null, 2) + '\n');
          "
          
          echo "=== latest.json ==="
          cat latest.json
          
          # Validate JSON
          node -e "JSON.parse(require('fs').readFileSync('latest.json','utf8')); console.log('JSON valid')"
          
          gh release upload "$TAG" latest.json \
            --repo "${{ github.repository }}" \
            --clobber
          echo "latest.json uploaded to release"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Push latest.json to dev branch
        shell: bash
        run: |
          if [ ! -f latest.json ]; then
            echo "::warning::latest.json not found, skipping push"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp latest.json "$RUNNER_TEMP/latest.json"
          git checkout -- .
          git fetch origin dev
          git checkout -B dev origin/dev
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: atualizar latest.json para v${{ inputs.test_version }}"
          git push origin HEAD:refs/heads/dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload test installer
        uses: actions/upload-artifact@v6
        with:
          name: datadoc-test-installer
          path: tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  verify-updater:
    name: Verify Updater Files
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release propagation
        run: sleep 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check latest.json in release
        run: |
          URL="https://github.com/matheusvcl/DataDoc/releases/download/v${{ inputs.test_version }}/latest.json"
          echo "Checking: $URL"

          HTTP_CODE=$(curl -s -o /tmp/latest.json -w "%{http_code}" -L "$URL")
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::latest.json not accessible in release (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo ""
          echo "=== latest.json content ==="
          cat /tmp/latest.json
          echo ""

          # Validate JSON structure
          node -e "
            const data = require('/tmp/latest.json');
            const platform = data.platforms && (
              data.platforms['windows-x86_64-nsis'] ||
              data.platforms['windows-x86_64'] ||
              data.platforms['windows-x86_64-msi']
            );
            if (!platform) {
              console.error('Missing windows platform in latest.json');
              console.error('Available platforms:', Object.keys(data.platforms || {}));
              process.exit(1);
            }
            console.log('Version:', data.version);
            console.log('Notes:', data.notes);
            console.log('URL:', platform.url);
            console.log('Signature:', platform.signature ? platform.signature.substring(0, 40) + '...' : 'MISSING');
            if (!platform.signature) process.exit(1);
            console.log('');
            console.log('Updater files OK!');
          "

      - name: Verify installer was signed
        run: |
          echo "Checking release assets..."
          RELEASE_URL="https://api.github.com/repos/matheusvcl/DataDoc/releases/tags/v${{ inputs.test_version }}"
          echo "Fetching: $RELEASE_URL"

          ASSETS=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}" "$RELEASE_URL" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            if (data.assets) {
              data.assets.forEach(a => {
                console.log(a.name, '-', (a.size / 1024 / 1024).toFixed(1) + 'MB');
              });
            }
            if (data.message) console.log('API:', data.message);
          ")
          echo "$ASSETS"

      - name: Summary
        run: |
          echo "## Teste de Atualização - Resultado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Versão de teste: \`${{ inputs.test_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- latest.json: verificado" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: \`https://raw.githubusercontent.com/matheusvcl/DataDoc/dev/latest.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Próximos passos" >> $GITHUB_STEP_SUMMARY
          echo "1. Baixe o instalador de teste nos artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Instale o app" >> $GITHUB_STEP_SUMMARY
          echo "3. Abra o app e vá em Configurações > Verificar Atualizações" >> $GITHUB_STEP_SUMMARY
          echo "4. Deve aparecer o dialog de atualização" >> $GITHUB_STEP_SUMMARY
