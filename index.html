<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://viacep.com.br; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>DataDoc</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="js/vendor/react.production.min.js"></script>
<script src="js/vendor/react-dom.production.min.js"></script>
<script src="js/vendor/babel.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/titlebar.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/datepicker.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/welcome.css">
<link rel="stylesheet" href="css/screens.css">
<script>
  (function() {
    var t = 'light';
    try {
      t = localStorage.getItem('datadoc_theme') === 'dark' ? 'dark' : 'light';
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
  (function() {
    try {
      if (localStorage.getItem('datadoc.sidebar.collapsed') === '1') {
        document.documentElement.setAttribute('data-sidebar-collapsed', '1');
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="titlebar">
  <div class="titlebar-drag" data-tauri-drag-region></div>
  <div class="titlebar-buttons">
    <button class="titlebar-btn" id="titlebar-minimize" aria-label="Minimizar">
      <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" fill="currentColor" rx="0.75"/></svg>
    </button>
    <button class="titlebar-btn" id="titlebar-maximize" aria-label="Maximizar">
      <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.3" rx="1"/></svg>
    </button>
    <button class="titlebar-btn titlebar-btn-close" id="titlebar-close" aria-label="Fechar">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M1 11L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div id="root"></div>
<script type="text/babel" src="js/shared.js"></script>
<script type="text/babel" src="js/onboarding.js"></script>
<script type="text/babel" src="js/welcome.js"></script>
<script type="text/babel" src="js/import.js"></script>
<script type="text/babel" src="js/export.js"></script>
<script type="text/babel" src="js/cadastro.js"></script>
<script type="text/babel" src="js/empresa.js"></script>
<script type="text/babel" src="js/preview.js"></script>
<script type="text/babel" src="js/historico.js"></script>
<script type="text/babel" src="js/settings.js"></script>
<script type="text/babel" src="js/update.js"></script>
<script type="text/babel" src="js/app.js"></script>
<script>
  // Tauri v2 window controls using built-in API
  (function() {
    var tries = 0;
    function init() {
      tries++;
      var t = window.__TAURI__;
      if (!t || !t.window) {
        if (tries < 100) setTimeout(init, 100);
        return;
      }
      var win = t.window.getCurrentWindow();
      function bind(id, fn) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          fn();
        });
      }
      bind('titlebar-minimize', function() { win.minimize(); });
      bind('titlebar-maximize', function() { win.toggleMaximize(); });
      bind('titlebar-close', function() { win.close(); });
    }
    init();
  })();
</script>
</body>
</html>
